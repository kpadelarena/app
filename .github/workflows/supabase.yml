name: Supabase

# Database tests on every PR that touches the schema, and migration
# deploys to the hosted project on merge to main. The deploy job needs
# three repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
# and SUPABASE_PROJECT_ID.

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase.yml"

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same CLI version as local development (the supabase devDependency).
      - run: pnpm supabase db start
      - run: pnpm supabase test db

  deploy:
    name: Deploy migrations
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      - run: pnpm supabase db push
